name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, vet, test, race, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'These files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/server

  integration:
    name: Redis, PostgreSQL, and gateway integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: modelgate
          POSTGRES_PASSWORD: modelgate_ci
          POSTGRES_DB: modelgate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modelgate -d modelgate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:8.10.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      MODELGATE_INTEGRATION: "1"
      MODELGATE_INTEGRATION_REDIS_ADDR: 127.0.0.1:6379
      MODELGATE_INTEGRATION_REDIS_DB: "15"
      MODELGATE_INTEGRATION_POSTGRES_DSN: postgres://modelgate:modelgate_ci@127.0.0.1:5432/modelgate?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run real-dependency integration tests
        run: go test -tags=integration ./tests/integration -count=1 -v

  container:
    name: Docker Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build ModelGate image
        run: docker compose build modelgate
      - name: Start complete stack
        run: docker compose up --detach --no-build --wait --wait-timeout 180
      - name: Verify gateway and observability
        shell: bash
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/health
          curl --fail --silent --show-error -H 'Content-Type: application/json' -d '{"model":"mock-model","messages":[{"role":"user","content":"CI smoke"}]}' http://127.0.0.1:8080/v1/chat/completions
          metrics="$(curl --fail --silent --show-error http://127.0.0.1:8080/metrics)"
          grep -q modelgate_requests_total <<< "$metrics"
          for attempt in {1..30}; do
            if targets="$(curl --fail --silent http://127.0.0.1:9090/api/v1/targets)" && grep -q '"health":"up"' <<< "$targets"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Prometheus did not report ModelGate healthy"
              exit 1
            fi
            sleep 2
          done
          for attempt in {1..30}; do
            if dashboard="$(curl --fail --silent --user admin:modelgate_local_only http://127.0.0.1:3000/api/dashboards/uid/modelgate-overview)" && grep -q '"uid":"modelgate-overview"' <<< "$dashboard"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Grafana did not provision the ModelGate dashboard"
              exit 1
            fi
            sleep 2
          done
      - name: Show service logs after failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop complete stack
        if: always()
        run: docker compose down --volumes --remove-orphans
